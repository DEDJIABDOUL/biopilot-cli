name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-latest"]  # BIOPILOT: no native Windows (WSL = Linux)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.21.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1

      - name: setup macOS shells
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          brew install fish
          brew install zsh

          for dir in /usr/local/share/zsh /usr/local/share/zsh/site-functions /usr/share/zsh /opt/homebrew/share/zsh /opt/homebrew/share/zsh/site-functions /opt/homebrew/share/fish /opt/homebrew/share/fish/vendor_completions.d; do
            [ -d "$dir" ] && sudo chmod g-w "$dir"
          done

      - name: setup linux shells
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-add-repository ppa:fish-shell/release-3
          sudo apt-get update
          sudo apt install fish zsh

          sudo chmod -R 755 /usr/share/zsh/vendor-completions
          sudo chown -R root:root /usr/share/zsh/vendor-completions
          sudo chmod -R 755 /usr/share/zsh
          sudo chown -R root:root /usr/share/zsh

      - name: setup oh-my-zsh
        shell: bash
        run: |
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
          git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k"

      - run: npm ci

      - run: npm run lint

      - run: npm run build:db  # BIOPILOT: compile the Catalog; fails on invalid YAML

      - run: npm test -- --coverage  # BIOPILOT: spec §14, BioPilot core coverage > 80 % (jest.config.cjs)

      - run: npm run perf:catalog  # BIOPILOT: spec §11 budgets, run alone so parallel tests do not skew timings

      - run: npm run build

      - run: npm link

      - run: npm run test:e2e
  # BIOPILOT: phase 5 exit (ticket #59): install the freshly packaged standalone binary with install.sh on
  # a clean HOME, under 30 s, use it, uninstall it without leftovers.
  install:
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.21.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1

      - run: npm ci
      - run: npm run build:db
      - run: npm run build
      - run: npm run package
      - run: scripts/ci/install-test.sh

  # BIOPILOT: spec §11 targets (ticket #66), with the §14 tolerance: session and memory against the
  # upstream engine (tag 0.0.4) built on the same runner, suggestion budgets, Catalog and binary sizes.
  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the upstream tag 0.0.4

      - name: Use Node.js 22.21.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1

      - run: npm ci
      - run: npm run build:db
      - run: npm run build
      - run: npm run package
      - run: npm run perf:targets
