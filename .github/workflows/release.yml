# BIOPILOT: phase 5 (ticket #56). Pushing a `v*` tag builds the standalone binary of each supported
# platform on its own runner, checks it answers from its embedded Catalog, and publishes the binaries with
# SHA256SUMS and install.sh on a GitHub Release. Run manually, it builds and keeps the binaries as workflow
# artifacts, publishing nothing.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22.21.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1

      - run: npm ci
      # BIOPILOT: 1.1.4 the better-sqlite3 addon rebuilt for glibc 2.28 (the npm package's needs 2.34).
      - name: Rebuild the SQLite addon for glibc 2.28
        if: runner.os == 'Linux'
        run: scripts/ci/build-sqlite-addon.sh
      - run: npm run build:db
      - run: npm run build
      - run: npm run package

      - name: The binary needs no more than glibc 2.28, and runs on Rocky Linux 8 and Ubuntu 20.04
        if: runner.os == 'Linux'
        run: |
          scripts/ci/check-glibc.sh "pkg/biopilot-${{ matrix.target }}"
          scripts/ci/old-distros-test.sh "pkg/biopilot-${{ matrix.target }}"

      - name: The binary runs and answers from its embedded Catalog
        shell: bash
        run: |
          binary="pkg/biopilot-${{ matrix.target }}"
          test -x "$binary"
          "$binary" --version
          "$binary" reinit
          "$binary" info fastp | head -3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: biopilot-${{ matrix.target }}
          path: pkg/biopilot-${{ matrix.target }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: biopilot-*
          merge-multiple: true

      - name: Compress, checksums
        working-directory: dist
        run: |
          # gzip: a third of the size (install under 30 s on an ordinary connection), available everywhere.
          gzip -9 biopilot-*
          sha256sum biopilot-*.gz > SHA256SUMS
          cp ../install.sh .
          cat SHA256SUMS

      - name: Sign the checksums
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.BIOPILOT_RELEASE_SIGNING_KEY }}
        run: |
          # install.sh refuses a release whose SHA256SUMS is not signed by this key (ECDSA P-256).
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::error::secret BIOPILOT_RELEASE_SIGNING_KEY is not set"; exit 1; fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out SHA256SUMS.sig SHA256SUMS
          # The secret must match the public key install.sh carries.
          openssl dgst -sha256 -verify ../scripts/release-signing-key.pub.pem -signature SHA256SUMS.sig SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "BioPilot CLI $GITHUB_REF_NAME" --generate-notes
