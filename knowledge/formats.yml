# yaml-language-server: $schema=../schemas/formats.schema.json
# File formats the tools refer to (`value.format`), declared once.
# kind file: `pattern` is matched against the file name, case-insensitively.
# kind prefix / dir: reference indexes, recognised from a directory listing.
formats:
  - name: fastq
    description: sequencing reads with base qualities
    pattern: '\.(fastq|fq)(\.gz|\.bz2|\.zst)?$'
  - name: fasta
    description: sequences (references, assemblies)
    pattern: '\.(fasta|fa|fna|ffn|faa|fas)(\.gz|\.bz2)?$'
  - name: sam
    description: alignments, text
    pattern: '\.sam$'
  - name: bam
    description: alignments, binary
    pattern: '\.bam$'
  - name: cram
    description: alignments, reference-compressed
    pattern: '\.cram$'
  # lot 3: a gVCF is recognised before a plain VCF (the first matching pattern wins)
  - name: gvcf
    description: genomic VCF (GATK -ERC GVCF), every site with reference blocks
    pattern: '\.g\.vcf(\.gz)?$'
  - name: vcf
    description: variant calls, text
    pattern: '\.vcf(\.gz)?$'
  - name: bcf
    description: variant calls, binary
    pattern: '\.bcf$'
  - name: bed
    description: genomic intervals
    pattern: '\.bed(\.gz)?$'
  - name: gtf
    description: gene annotation (GTF)
    pattern: '\.gtf(\.gz)?$'
  - name: gff
    description: gene annotation (GFF3)
    pattern: '\.(gff|gff3)(\.gz)?$'
  - name: fai
    description: FASTA index (samtools faidx)
    pattern: '\.fai$'
  - name: json
    description: JSON report
    pattern: '\.json$'
  - name: html
    description: HTML report
    pattern: '\.html?$'
  - name: minimap2-index
    description: minimap2 prebuilt index
    pattern: '\.mmi$'
  - name: bwa-index
    description: bwa index, named by the reference it was built from
    kind: prefix
    suffixes: [".amb", ".ann", ".bwt", ".pac", ".sa"]
  - name: salmon-index
    description: salmon index folder
    kind: dir
    # salmon 1.x writes versionInfo.json; 2.x no longer does, both write refseq.bin.
    marker: [versionInfo.json, refseq.bin]
  - name: bowtie2-index
    description: bowtie2 index, named by the prefix given to bowtie2-build
    kind: prefix
    suffixes: [".1.bt2", ".rev.1.bt2"]
  - name: hisat2-index
    description: hisat2 index, named by the prefix given to hisat2-build
    kind: prefix
    suffixes: [".1.ht2", ".2.ht2"]
  - name: bwa-mem2-index
    description: bwa-mem2 index, named by the reference it was built from
    kind: prefix
    suffixes: [".0123", ".bwt.2bit.64"]
  - name: star-index
    description: STAR genome index folder
    kind: dir
    marker: genomeParameters.txt
# part A (ticket #11)
  - name: rad
    description: salmon / piscem mapping records (RAD)
    pattern: '\.rad$'
  - name: salmon-quant
    description: salmon quant result folder
    kind: dir
    marker: quant.sf
  # part B (ticket #12)
  - name: paf
    description: pairwise alignments, text (minimap2)
    pattern: '\.paf(\.gz)?$'
  - name: sai
    description: bwa aln intermediate alignments
    pattern: '\.sai$'
  - name: bai
    description: BAM index
    pattern: '\.bai$'
  - name: csi
    description: coordinate-sorted index (BAM, VCF, BCF)
    pattern: '\.csi$'
  - name: crai
    description: CRAM index
    pattern: '\.crai$'
  - name: tbi
    description: tabix index of a compressed text file
    pattern: '\.tbi$'
  - name: dict
    description: sequence dictionary of a reference
    pattern: '\.dict$'
  - name: interval-list
    description: genomic intervals with a sequence dictionary header (Picard, GATK)
    pattern: '\.interval_list$'
  - name: chain
    description: alignment between two genome assemblies, for liftover
    pattern: '\.(over\.)?chain(\.gz)?$'
  - name: blast-nucl-db
    description: BLAST nucleotide database, named by its prefix
    kind: prefix
    suffixes: [".nhr", ".nin", ".nsq"]
  # lot 3: variants, intervals and annotation
  - name: bedgraph
    description: coverage or signal per interval
    pattern: '\.(bedgraph|bdg|bg)(\.gz)?$'
  - name: genome
    description: sequence names and lengths, one per line (bedtools genome file, chrom.sizes)
    pattern: '(\.genome|\.chrom\.sizes|\.sizes)$'
  - name: gatk-table
    description: GATK table (base recalibration, pileup summaries, contamination, segments)
    pattern: '\.table$'
  - name: f1r2
    description: Mutect2 F1R2 counts, for LearnReadOrientationModel
    pattern: '\.f1r2\.tar\.gz$'
  - name: orientation-model
    description: read orientation artifact priors, from LearnReadOrientationModel
    pattern: '(artifact[-_]prior|read[-_]orientation[-_]model)[^/]*\.tar\.gz$'
  - name: mutect-stats
    description: Mutect2 calling statistics, for FilterMutectCalls
    pattern: '\.vcf(\.gz)?\.stats$'
  - name: vqsr-tranches
    description: VQSR tranches, from VariantRecalibrator
    pattern: '\.tranches$'
  - name: vqsr-recal
    description: VQSR recalibration table (VCF-like), from VariantRecalibrator
    pattern: '\.recal(\.vcf)?(\.gz)?$'
  - name: genomicsdb
    description: GATK GenomicsDB workspace folder
    kind: dir
    marker: callset.json
  - name: toml
    description: TOML configuration (vcfanno)
    pattern: '\.toml$'
