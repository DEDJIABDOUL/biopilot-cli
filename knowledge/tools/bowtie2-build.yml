# yaml-language-server: $schema=../../schemas/tool.schema.json
# bowtie2-build 2.5.5 (package bowtie2), written from its recorded --help:
# knowledge/help/bowtie2-build/2.5.5/root.txt (GPL-3.0-or-later; attribution in RECORDING.yml next
# to it) and the Bowtie 2 manual, in our own words (spec decision 31).
name: bowtie2-build
package: bowtie2
description: Builds the bowtie2 index of a reference genome
version: { args: ["--version"], regex: 'version (\d[\w.]*)' }
help: ["--help"]
arguments:
  - name: reference_in
    description: reference FASTA files, comma-separated
    value: { type: file, format: fasta, io: input }
  - name: bt2_index_base
    description: prefix of the index files to write (folder and base name)
    value: { type: string }
options:
  - names: ["--threads"]
    description: threads
    value: { type: int }
    rank: 90
    threads: true
  - names: ["-f"]
    description: reference files are FASTA (default)
    rank: 15
  - names: ["-c"]
    description: reference sequences are given on the command line
    rank: 10
  - names: ["--large-index"]
    description: build a large (64-bit, .bt2l) index even under 4 billion bases
    rank: 40
  - names: ["-a", "--noauto"]
    description: do not fit -p, --bmax and --dcv to the available memory
    rank: 15
  - names: ["-p", "--packed"]
    description: packed strings, slower but less memory
    rank: 20
  - names: ["--bmax"]
    description: largest bucket of the suffix-array builder
    value: { type: int }
    rank: 10
  - names: ["--bmaxdivn"]
    description: largest bucket, as a divisor of the reference length
    value: { type: int }
    default: 4
    rank: 10
  - names: ["--dcv"]
    description: difference-cover period
    value: { type: int }
    default: 1024
    rank: 10
  - names: ["--nodc"]
    description: no difference cover (quadratic time)
    rank: 5
  - names: ["-r", "--noref"]
    description: do not build the .3 and .4 files
    rank: 10
  - names: ["-3", "--justref"]
    description: build only the .3 and .4 files
    rank: 10
  - names: ["-o", "--offrate"]
    description: sample the suffix array every 2^N characters (lower is faster, larger)
    value: { type: int }
    default: 5
    rank: 20
  - names: ["-t", "--ftabchars"]
    description: characters of the initial lookup table
    value: { type: int }
    default: 10
    rank: 10
  - names: ["--seed"]
    description: random seed
    value: { type: int }
    rank: 10
  - names: ["-q", "--quiet"]
    description: print less
    rank: 25
  - names: ["--verbose"]
    description: print the command run
    rank: 10
  - names: ["--debug"]
    description: debug binary, slower, with assertions
    rank: 5
  - names: ["--sanitized"]
    description: sanitized binary (ASan, UBSan), slower
    rank: 5
