# yaml-language-server: $schema=../../schemas/tool.schema.json
# GATK 4.6.2.0, written from its recorded helps: knowledge/help/gatk/4.6.2.0/ (BSD-3-Clause; attribution in
# RECORDING.yml next to it) and its documentation (https://gatk.broadinstitute.org), in our own words
# (spec decision 31). Only 16 of its tools are described, and of their arguments the ones in common use:
# the others are read from the tool's own help once its Profile is computed. A Boolean takes true or false.
# Ranks follow the shared scale of spec §6.4.
name: gatk
package: gatk4
description: 'Broad Institute Genome Analysis Toolkit: germline and somatic variant calling, base recalibration, filtering'
version:
  args: [--version]
  regex: GATK\) v(\d[\w.]*)
help: []
options:
- names: [--java-options]
  description: options of the Java virtual machine, in quotes, e.g. "-Xmx8g -XX:ParallelGCThreads=2"
  value: {type: string}
  rank: 80
- names: [--dry-run]
  description: print the Java command without running it
  rank: 20
- names: [--gatk-config-file]
  description: GATK configuration file
  value: {type: file}
  rank: 15
- names: [--spark-runner]
  description: 'how Spark tools run: LOCAL, SPARK (spark-submit on a cluster) or GCS (Dataproc)'
  value:
    type: enum
    values: [LOCAL, SPARK, GCS]
  rank: 25
- names: [--spark-master]
  description: Spark master URL, with --spark-runner SPARK
  value: {type: string}
  rank: 15
- names: [--spark-submit-command]
  description: spark-submit command to use, with --spark-runner SPARK
  value: {type: string}
  rank: 10
- names: [--cluster]
  description: Dataproc cluster, with --spark-runner GCS (after --)
  value: {type: string}
  rank: 10
- names: [--debug-port]
  description: port of a Java debug agent
  value: {type: int}
  rank: 10
- names: [--debug-suspend]
  description: suspend the Java VM until a debugger connects
  rank: 10
commands:
- name: HaplotypeCaller
  help: [HaplotypeCaller, --help]
  description: call germline SNVs and indels by local re-assembly of haplotypes; -ERC GVCF for joint genotyping
  options:
  - names: [--input, -I]
    description: BAM or CRAM of reads (repeatable)
    value:
      type: file
      format: [bam, cram]
      io: input
    repeatable: true
    rank: 95
  - names: [--output, -O]
    description: VCF to write (.g.vcf.gz with -ERC GVCF)
    value:
      type: file
      format: [vcf, gvcf]
      io: output
    rank: 95
  - names: [--reference, -R]
    description: reference FASTA, with its .fai and .dict
    value: {type: file, format: fasta, io: input}
    rank: 90
  - names: [--emit-ref-confidence, -ERC]
    description: 'reference confidence: GVCF (blocks) or BP_RESOLUTION (every site), for joint genotyping'
    value:
      type: enum
      values: [NONE, BP_RESOLUTION, GVCF]
    default: NONE
    rank: 80
  - names: [--intervals, -L]
    description: 'genomic intervals to process: chr:start-end, or an interval_list, BED or VCF file (repeatable)'
    value:
      type: file
      format: [interval-list, bed, vcf]
    repeatable: true
    rank: 75
  - names: [--dbsnp, -D]
    description: dbSNP VCF, whose IDs fill the ID column
    value: {type: file, format: vcf}
    rank: 55
  - names: [--sample-ploidy, -ploidy]
    description: ploidy of each sample (number of chromosomes per sample in pools)
    value: {type: int}
    default: 2
    rank: 55
  - names: [--standard-min-confidence-threshold-for-calling, -stand-call-conf]
    description: least phred confidence to call a variant
    value: {type: float}
    default: 30.0
    rank: 50
  - names: [--native-pair-hmm-threads]
    description: threads of the native pair-HMM
    value: {type: int}
    default: 4
    rank: 50
    threads: true
  - names: [--exclude-intervals, -XL]
    description: intervals to leave out, as for --intervals (repeatable)
    value:
      type: file
      format: [interval-list, bed, vcf]
    repeatable: true
    rank: 45
  - names: [--interval-padding, -ip]
    description: bp added on both sides of each interval
    value: {type: int}
    default: 0
    rank: 45
  - names: [--tmp-dir]
    description: folder for temporary files
    value: {type: dir}
    rank: 45
  - names: [--bam-output, -bamout]
    description: BAM of the reads realigned to the assembled haplotypes, for inspection
    value: {type: file, format: bam}
    rank: 45
  - names: [--annotation, -A]
    description: add this annotation to the output (repeatable)
    value: {type: string}
    repeatable: true
    rank: 40
  - names: [--annotation-group, -G]
    description: add this group of annotations, e.g. StandardAnnotation, AS_StandardAnnotation (repeatable)
    value: {type: string}
    repeatable: true
    rank: 40
  - names: [--alleles]
    description: VCF of alleles to genotype in any case (force-calling)
    value: {type: file, format: vcf}
    rank: 40
  - names: [--dont-use-soft-clipped-bases]
    description: do not use soft-clipped bases (e.g. for RNA-seq)
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 40
  - names: [--pcr-indel-model]
    description: 'indel error model of PCR: NONE for PCR-free libraries'
    value:
      type: enum
      values: [NONE, HOSTILE, AGGRESSIVE, CONSERVATIVE]
    default: CONSERVATIVE
    rank: 40
  - names: [--max-alternate-alleles]
    description: most alternate alleles genotyped at a site
    value: {type: int}
    default: 6
    rank: 35
  - names: [--min-base-quality-score, -mbq]
    description: least base quality used in calling
    value: {type: int}
    default: 10
    rank: 35
  - names: [--sample-name, -ALIAS]
    description: call only the reads of this sample
    value: {type: string}
    rank: 30
  - names: [--output-mode]
    description: which sites to write
    value:
      type: enum
      values: [EMIT_VARIANTS_ONLY, EMIT_ALL_CONFIDENT_SITES, EMIT_ALL_ACTIVE_SITES]
    default: EMIT_VARIANTS_ONLY
    rank: 30
  - names: [--interval-set-rule, -isr]
    description: 'how several interval lists combine: UNION or INTERSECTION'
    value:
      type: enum
      values: [UNION, INTERSECTION]
    default: UNION
    rank: 30
  - names: [--interval-merging-rule, -imr]
    description: merge abutting intervals (ALL) or only overlapping ones (OVERLAPPING_ONLY)
    value:
      type: enum
      values: [ALL, OVERLAPPING_ONLY]
    default: ALL
    rank: 30
  - names: [--read-filter, -RF]
    description: add a read filter by name (repeatable)
    value: {type: string}
    repeatable: true
    rank: 30
  - names: [--create-output-variant-index, -OVI]
    description: write an index of the output VCF
    value:
      type: enum
      values: ['true', 'false']
    default: 'true'
    rank: 30
  - names: [--create-output-bam-index, -OBI]
    description: write an index of the output BAM
    value:
      type: enum
      values: ['true', 'false']
    default: 'true'
    rank: 30
  - names: [--annotations-to-exclude, -AX]
    description: leave out this annotation (repeatable)
    value: {type: string}
    repeatable: true
    rank: 30
  - names: [--pedigree, -ped]
    description: PED file of the family structure, for pedigree annotations
    value: {type: file}
    rank: 30
  - names: [--max-reads-per-alignment-start]
    description: 'downsample to this many reads starting at a position (0: no downsampling)'
    value: {type: int}
    default: 50
    rank: 30
  - names: [--contamination-fraction-to-filter, -contamination]
    description: fraction of reads removed as contamination
    value: {type: float}
    default: 0.0
    rank: 25
  - names: [--disable-read-filter, -DF]
    description: turn off one of the tool's default read filters (repeatable)
    value: {type: string}
    repeatable: true
    rank: 25
  - names: [--read-validation-stringency, -VS]
    description: 'how strictly input records are checked: STRICT, LENIENT or SILENT'
    value:
      type: enum
      values: [STRICT, LENIENT, SILENT]
    default: SILENT
    rank: 25
  - names: [--sequence-dictionary]
    description: sequence dictionary (.dict) to use instead of the inputs'
    value: {type: file, format: dict}
    rank: 25
  - names: [--sites-only-vcf-output]
    description: write the VCF without genotypes (sites only)
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 25
  - names: [--heterozygosity]
    description: expected heterozygosity, the prior for SNPs
    value: {type: float}
    default: 0.001
    rank: 25
  - names: [--dragen-mode]
    description: settings for DRAGEN-GATK concordance
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 25
  - names: [--gvcf-gq-bands, -GQB]
    description: GQ bounds of the reference blocks of a GVCF (repeatable)
    value: {type: int}
    repeatable: true
    rank: 20
  - names: [--ploidy-regions]
    description: BED of regions with another ploidy
    value: {type: file, format: bed}
    rank: 20
  - names: [--do-not-run-physical-phasing]
    description: do not phase nearby variants
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 20
  - names: [--interval-exclusion-padding, -ixp]
    description: bp added on both sides of each excluded interval
    value: {type: int}
    default: 0
    rank: 20
  - names: [--read-index]
    description: index of the input reads, when not next to them (repeatable)
    value:
      type: file
      format: [bai, crai, csi]
    repeatable: true
    rank: 20
  - names: [--lenient, -LE]
    description: accept slightly malformed input VCF records
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 20
  - names: [--minimum-mapping-quality]
    description: least mapping quality of the MappingQualityReadFilter
    value: {type: int}
    rank: 20
  - names: [--max-genotype-count]
    description: most genotypes considered at a site
    value: {type: int}
    default: 1024
    rank: 20
  - names: [--indel-heterozygosity]
    description: expected heterozygosity, the prior for indels
    value: {type: float}
    default: 0.000125
    rank: 20
  - names: [--population-callset, -population]
    description: VCF of the population's calls, used as genotype priors
    value: {type: file, format: vcf}
    rank: 20
  - names: [--assembly-region-padding]
    description: bp of padding around each active region
    value: {type: int}
    default: 100
    rank: 20
  - names: [--kmer-size]
    description: k-mer size of the assembly graph (repeatable)
    value: {type: int}
    repeatable: true
    rank: 20
  - names: [--max-mnp-distance, -mnp-dist]
    description: 'merge SNVs this close into MNPs (0: never)'
    value: {type: int}
    default: 0
    rank: 20
  - names: [--contamination-fraction-per-sample-file, -contamination-file]
    description: file of contamination fractions per sample
    value: {type: file}
    rank: 15
  - names: [--comparison, -comp]
    description: VCF of comparison calls, for annotation (repeatable)
    value: {type: file, format: vcf}
    repeatable: true
    rank: 15
  - names: [--mapping-quality-threshold-for-genotyping]
    description: least mapping quality of reads used in genotyping
    value: {type: int}
    default: 20
    rank: 15
  - names: [--disable-tool-default-read-filters]
    description: turn off all of the tool's default read filters
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 15
  - names: [--disable-sequence-dictionary-validation]
    description: do not check that the inputs' sequence dictionaries agree
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 15
  - names: [--arguments_file]
    description: file of arguments added to the command line (repeatable)
    value: {type: file}
    repeatable: true
    rank: 15
  - names: [--verbosity]
    description: log level
    value:
      type: enum
      values: [ERROR, WARNING, INFO, DEBUG]
    default: INFO
    rank: 15
  - names: [--QUIET]
    description: no job summary on standard error
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 15
  - names: [--enable-all-annotations]
    description: compute every available annotation
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 15
  - names: [--disable-tool-default-annotations]
    description: turn off the tool's default annotations
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 15
  - names: [--heterozygosity-stdev]
    description: standard deviation of the heterozygosity across samples
    value: {type: float}
    default: 0.01
    rank: 15
  - names: [--genotype-assignment-method, -gam]
    description: how genotypes are set when likelihoods are given
    value:
      type: enum
      values: [SET_TO_NO_CALL, USE_PLS_TO_ASSIGN, USE_POSTERIORS_ANNOTATION, SET_TO_NO_CALL_NO_ANNOTATIONS, BEST_MATCH_TO_ORIGINAL, DO_NOT_ASSIGN_GENOTYPES,
        USE_POSTERIOR_PROBABILITIES, PREFER_PLS]
    rank: 15
  - names: [--min-assembly-region-size]
    description: smallest active region, in bp
    value: {type: int}
    default: 50
    rank: 15
  - names: [--max-assembly-region-size]
    description: largest active region, in bp
    value: {type: int}
    default: 300
    rank: 15
  - names: [--force-active]
    description: treat every region as active
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 15
  - names: [--assembly-region-out]
    description: file listing the active regions
    value: {type: file}
    rank: 15
  - names: [--pair-hmm-implementation, -pairHMM]
    description: pair-HMM implementation
    value:
      type: enum
      values: [EXACT, ORIGINAL, LOGLESS_CACHING, AVX_LOGLESS_CACHING, AVX_LOGLESS_CACHING_OMP, FASTEST_AVAILABLE]
    default: FASTEST_AVAILABLE
    rank: 15
  - names: [--dragstr-params-path]
    description: DRAGstr parameters from CalibrateDragstrModel
    value: {type: file}
    rank: 15
  - names: [--floor-blocks]
    description: round GQ of reference blocks down to their band
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--all-site-pls]
    description: annotate PLs at every site (with BP_RESOLUTION)
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--inverted-read-filter, -XRF]
    description: keep the reads that fail this filter (repeatable)
    value: {type: string}
    repeatable: true
    rank: 10
  - names: [--create-output-variant-md5, -OVM]
    description: write an MD5 digest of the output VCF
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--create-output-bam-md5, -OBM]
    description: write an MD5 digest of the output BAM
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--add-output-vcf-command-line]
    description: record the command line in the output VCF header
    value:
      type: enum
      values: ['true', 'false']
    default: 'true'
    rank: 10
  - names: [--add-output-sam-program-record]
    description: record the program in the output BAM header
    value:
      type: enum
      values: ['true', 'false']
    default: 'true'
    rank: 10
  - names: [--disable-bam-index-caching, -DBIC]
    description: do not cache BAM indexes (less memory, slower with many intervals)
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--seconds-between-progress-updates]
    description: seconds between progress messages
    value: {type: float}
    default: 10.0
    rank: 10
  - names: [--max-variants-per-shard]
    description: variants per shard of the output VCF (0 for one file)
    value: {type: int}
    default: 0
    rank: 10
  - names: [--cloud-prefetch-buffer, -CPB]
    description: prefetch buffer for cloud inputs, in MB
    value: {type: int}
    default: 40
    rank: 10
  - names: [--cloud-index-prefetch-buffer, -CIPB]
    description: prefetch buffer for cloud indexes, in MB
    value: {type: int}
    default: -1
    rank: 10
  - names: [--gcs-max-retries, -gcs-retries]
    description: retries of Google Cloud Storage requests
    value: {type: int}
    default: 20
    rank: 10
  - names: [--gcs-project-for-requester-pays]
    description: Google Cloud project billed for requester-pays buckets
    value: {type: string}
    rank: 10
  - names: [--gatk-config-file]
    description: GATK configuration file
    value: {type: file}
    rank: 10
  - names: [--use-jdk-deflater, -jdk-deflater]
    description: JDK compressor instead of Intel's
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--use-jdk-inflater, -jdk-inflater]
    description: JDK decompressor instead of Intel's
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--help, -h]
    description: print the help of the tool and exit
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--version]
    description: print the version and exit
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--showHidden]
    description: also show hidden arguments in the help
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--sample]
    description: keep only reads of this sample (with the SampleReadFilter)
    value: {type: string}
    repeatable: true
    rank: 10
  - names: [--library]
    description: keep only reads of this library (with the LibraryReadFilter)
    value: {type: string}
    repeatable: true
    rank: 10
  - names: [--keep-read-group]
    description: keep only reads of this read group (with the ReadGroupReadFilter)
    value: {type: string}
    rank: 10
  - names: [--read-name]
    description: keep only reads of this name (with the ReadNameReadFilter)
    value: {type: string}
    rank: 10
  - names: [--min-read-length]
    description: least read length of the ReadLengthReadFilter
    value: {type: int}
    rank: 10
  - names: [--max-read-length]
    description: largest read length of the ReadLengthReadFilter
    value: {type: int}
    rank: 10
  - names: [--founder-id]
    description: sample ID of a founder, for pedigree annotations (repeatable)
    value: {type: string}
    repeatable: true
    rank: 10
  - names: [--num-reference-samples-if-no-call]
    description: number of hom-ref samples assumed for no-calls
    value: {type: int}
    default: 0
    rank: 10
  - names: [--use-posteriors-to-calculate-qual, -gp-qual]
    description: compute QUAL from genotype posteriors
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--use-new-qual-calculator, -new-qual]
    description: 'new QUAL model (deprecated: always on)'
    value:
      type: enum
      values: ['true', 'false']
    default: 'true'
    rank: 10
  - names: [--annotate-with-num-discovered-alleles]
    description: annotate the number of alternate alleles discovered
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--graph-output, -graph]
    description: file of the assembly graphs, for debugging
    value: {type: file}
    rank: 10
  - names: [--debug-assembly, -debug]
    description: print assembly details
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--smith-waterman]
    description: Smith-Waterman implementation
    value:
      type: enum
      values: [FASTEST_AVAILABLE, AVX_ENABLED, JAVA]
    default: FASTEST_AVAILABLE
    rank: 10
  - names: [--linked-de-bruijn-graph]
    description: linked de Bruijn graph assembly (experimental)
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
  - names: [--soft-clip-low-quality-ends]
    description: soft-clip low-quality read ends instead of hard-clipping them
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 10
- name: Mutect2
  help: [Mutect2, --help]
  description: call somatic SNVs and indels in tumour samples, with or without a matched normal
  options:
  - names: [--input, -I]
    description: BAM or CRAM of the tumour and the matched normal (repeatable)
    value:
      type: file
      format: [bam, cram]
      io: input
    repeatable: true
    rank: 95
  - names: [--output, -O]
    description: VCF of unfiltered somatic calls (filter it with FilterMutectCalls)
    value: {type: file, format: vcf, io: output}
    rank: 95
  - names: [--reference, -R]
    description: reference FASTA, with its .fai and .dict
    value: {type: file, format: fasta, io: input}
    rank: 90
  - names: [--normal-sample, -normal]
    description: sample name (SM) of the matched normal (repeatable)
    value: {type: string}
    repeatable: true
    rank: 85
  - names: [--germline-resource]
    description: population VCF with allele frequencies (gnomAD AF-only), as germline priors
    value: {type: file, format: vcf}
    rank: 80
  - names: [--panel-of-normals, -pon]
    description: panel-of-normals VCF of recurrent artifacts
    value: {type: file, format: vcf}
    rank: 80
  - names: [--emit-ref-confidence, -ERC]
    description: 'reference confidence: GVCF (blocks) or BP_RESOLUTION (every site), for joint genotyping'
    value:
      type: enum
      values: [NONE, BP_RESOLUTION, GVCF]
    default: NONE
    rank: 80
  - names: [--f1r2-tar-gz]
    description: F1R2 counts to write, for LearnReadOrientationModel (FFPE, OxoG)
    value: {type: file, format: f1r2}
    rank: 75
  - names: [--intervals, -L]
    description: 'genomic intervals to process: chr:start-end, or an interval_list, BED or VCF file (repeatable)'
    value:
      type: file
      format: [interval-list, bed, vcf]
    repeatable: true
    rank: 75
  - names: [--native-pair-hmm-threads]
    description: threads of the native pair-HMM
    value: {type: int}
    default: 4
    rank: 50
    threads: true
  - names: [--exclude-intervals, -XL]
    description: intervals to leave out, as for --intervals (repeatable)
    value:
      type: file
      format: [interval-list, bed, vcf]
    repeatable: true
    rank: 45
  - names: [--interval-padding, -ip]
    description: bp added on both sides of each interval
    value: {type: int}
    default: 0
    rank: 45
  - names: [--tmp-dir]
    description: folder for temporary files
    value: {type: dir}
    rank: 45
  - names: [--bam-output, -bamout]
    description: BAM of the reads realigned to the assembled haplotypes, for inspection
    value: {type: file, format: bam}
    rank: 45
  - names: [--mitochondria-mode]
    description: settings for mitochondrial calling
    value:
      type: enum
      values: ['true', 'false']
    default: 'false'
    rank: 40
  - names: [--annotation, -A]
    description: add this annotation to the output (repeatable)
    value: {type: string}
    repeatable: true
    rank: 40
