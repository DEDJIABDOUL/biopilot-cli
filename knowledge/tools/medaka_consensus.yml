# yaml-language-server: $schema=../../schemas/tool.schema.json
# medaka_consensus 2.2.2 (package medaka), written from its recorded help: knowledge/help/medaka_consensus/2.2.2/
# (Oxford Nanopore Technologies Public License 1.0; attribution in RECORDING.yml next to it)
# and its documentation (https://github.com/nanoporetech/medaka), in our own words
# (spec decision 31). Model names are taken from the helps.
# Its help takes about 7 s (it lists the models through Python), beyond the 2.5 s allowed:
# no help is read, the version comes from conda-meta and the options from here.
# Ranks follow the shared scale of spec §6.4.
name: medaka_consensus
package: medaka
description: Polishes a draft assembly with Nanopore reads (alignment, inference, stitching in one step)
version: { args: [ -h ], regex: "^medaka (\\d[\\w.]*)" }
platforms: [ nanopore ]
options:
  - names: [ -i ]
    description: basecalled reads, FASTA or FASTQ (required)
    value: { type: file, format: [ fastq, fasta ], io: input }
    rank: 97
  - names: [ -d ]
    description: draft assembly to polish, FASTA (required)
    value: { type: file, format: fasta, io: input }
    rank: 95
  - names: [ -o ]
    description: output folder
    value: { type: dir, io: output }
    default: medaka
    rank: 90
  - names: [ -m ]
    description: model, named after the basecaller model of the reads; or a model file from medaka train
    value: { type: string, values: [ r103_fast_g507, r103_hac_g507, r103_sup_g507, r1041_e82_260bps_fast_g632, r1041_e82_260bps_hac_g632, r1041_e82_260bps_hac_v4.0.0, r1041_e82_260bps_hac_v4.1.0, r1041_e82_260bps_joint_apk_ulk_v5.0.0, r1041_e82_260bps_sup_g632, r1041_e82_260bps_sup_v4.0.0, r1041_e82_260bps_sup_v4.1.0, r1041_e82_400bps_bacterial_methylation, r1041_e82_400bps_fast_g615, r1041_e82_400bps_fast_g632, r1041_e82_400bps_hac_g615, r1041_e82_400bps_hac_g632, r1041_e82_400bps_hac_v4.0.0, r1041_e82_400bps_hac_v4.1.0, r1041_e82_400bps_hac_v4.2.0, r1041_e82_400bps_hac_v4.3.0, r1041_e82_400bps_hac_v5.0.0, r1041_e82_400bps_hac_v5.0.0_rl_lstm384_dwells, r1041_e82_400bps_hac_v5.0.0_rl_lstm384_no_dwells, r1041_e82_400bps_hac_v5.2.0, r1041_e82_400bps_hac_v5.2.0_rl_lstm384_dwells, r1041_e82_400bps_hac_v5.2.0_rl_lstm384_no_dwells, r1041_e82_400bps_hac_v6.0.0, r1041_e82_400bps_hac_v6.0.0_rl_lstm384_dwells, r1041_e82_400bps_hac_v6.0.0_rl_lstm384_no_dwells, r1041_e82_400bps_sup_g615, r1041_e82_400bps_sup_v4.0.0, r1041_e82_400bps_sup_v4.1.0, r1041_e82_400bps_sup_v4.2.0, r1041_e82_400bps_sup_v4.3.0, r1041_e82_400bps_sup_v5.0.0, r1041_e82_400bps_sup_v5.0.0_rl_lstm384_dwells, r1041_e82_400bps_sup_v5.0.0_rl_lstm384_no_dwells, r1041_e82_400bps_sup_v5.2.0, r1041_e82_400bps_sup_v5.2.0_rl_lstm384_dwells, r1041_e82_400bps_sup_v5.2.0_rl_lstm384_no_dwells, r104_e81_fast_g5015, r104_e81_hac_g5015, r104_e81_sup_g5015, r104_e81_sup_g610, r941_e81_fast_g514, r941_e81_hac_g514, r941_e81_sup_g514, r941_min_fast_g507, r941_min_hac_g507, r941_min_sup_g507, r941_prom_fast_g507, r941_prom_hac_g507, r941_prom_sup_g507, r941_sup_plant_g610 ] }
    default: r1041_e82_400bps_sup_v5.2.0
    rank: 80
  - names: [ -t ]
    description: threads for the feature step
    value: { type: int }
    default: 1
    rank: 85
    threads: true
  - names: [ -b ]
    description: "batch size: lower it if memory runs out"
    value: { type: int }
    default: 100
    rank: 40
  - names: [ -f ]
    description: overwrite the outputs (they are reused by default)
    rank: 35
  - names: [ -x ]
    description: rebuild the alignment index
    rank: 20
  - names: [ -p ]
    description: prefix of the output files
    value: { type: string }
    default: consensus
    rank: 30
  - names: [ -g ]
    description: do not fill gaps with the draft sequence
    rank: 25
  - names: [ -r ]
    description: character filling the gaps instead of the draft
    value: { type: string }
    rank: 15
  - names: [ -q ]
    description: write FASTQ with per-base qualities
    rank: 30
  - names: [ -B ]
    description: regions to polish
    value: { type: string }
    rank: 30
  - names: [ -M ]
    description: least mapping quality
    value: { type: int }
    rank: 20
  - names: [ --bacteria ]
    description: pick the best model for bacterial and plasmid sequencing
    rank: 45
