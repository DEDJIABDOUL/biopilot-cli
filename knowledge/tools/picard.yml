        rank: 25
      - names: [ --ASSUME_SORTED, -AS ]
        description: ignore the sort order of the header
        value: { type: enum, values: [ "true", "false" ] }
        default: "true"
        rank: 20
      - names: [ --COMPRESSION_LEVEL ]
        description: compression level of BAM and VCF output
        value: { type: int }
