        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 45
      - names: [ --MINIMUM_BASE_QUALITY, -Q ]
        description: lowest base quality counted
        value: { type: int }
        default: 20
        rank: 45
      - names: [ --MINIMUM_MAPPING_QUALITY, -MQ ]
        description: lowest mapping quality counted
        value: { type: int }
        default: 20
        rank: 45
      - names: [ --VALIDATION_STRINGENCY ]
        description: how strictly SAM records are checked; SILENT or LENIENT tolerate faulty input
        value: { type: enum, values: [ STRICT, LENIENT, SILENT ] }
        default: STRICT
        rank: 45
      - names: [ --REFERENCE_SEQUENCE, -R ]
        description: reference FASTA (needed for CRAM)
        value: { type: file, format: fasta }
        rank: 40
      - names: [ --INTERVALS ]
        description: restrict the metrics to these intervals
        value: { type: file, format: [ interval-list, bed ] }
        rank: 40
      - names: [ --COVERAGE_CAP, -CAP ]
        description: coverage above this counts as this
        value: { type: int }
        default: 250
        rank: 30
      - names: [ --MAX_RECORDS_IN_RAM ]
        description: records held in memory before spilling to disk; more uses more RAM and fewer files
        value: { type: int }
        default: 500000
        rank: 30
      - names: [ --TMP_DIR ]
        description: folders for temporary files (repeatable)
        value: { type: dir }
        repeatable: true
        rank: 30
      - names: [ --USE_FAST_ALGORITHM ]
        description: faster algorithm
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 30
      - names: [ --COUNT_UNPAIRED ]
        description: count unpaired reads and pairs with one end unmapped
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 25
      - names: [ --COMPRESSION_LEVEL ]
        description: compression level of BAM and VCF output
        value: { type: int }
        default: 5
        rank: 20
