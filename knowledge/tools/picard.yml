# yaml-language-server: $schema=../../schemas/tool.schema.json
# Picard 3.5.0, written from its recorded helps: knowledge/help/picard/3.5.0/ (MIT;
# attribution in RECORDING.yml next to it) and its documentation
# (https://broadinstitute.github.io/picard), in our own words (spec decision 31).
# Only the most used of Picard's tools are described: the 20 recorded. Arguments use the
# --NAME value form (the legacy NAME=value form is not completed); a Boolean takes true or false.
# Ranks follow the shared scale of spec §6.4.
name: picard
package: picard
description: "Broad Institute tools for SAM/BAM/CRAM and VCF files: sorting, duplicates, read groups, QC metrics"
version: { args: [ SortSam, --version ], regex: "Version:\\s*(\\d[\\w.]*)" }
help: [ -h ]
commands:
  - name: SortSam
    help: [ SortSam, -h ]
    description: sort a SAM, BAM or CRAM file by coordinate, read name or duplicate order
    options:
      - names: [ --INPUT, -I ]
        description: alignments to sort
        value: { type: file, format: [ bam, sam, cram ], io: input }
        rank: 95
      - names: [ --OUTPUT, -O ]
        description: sorted alignments
        value: { type: file, format: [ bam, sam, cram ], io: output }
        rank: 90
      - names: [ --SORT_ORDER, -SO ]
        description: "order: coordinate (for indexing and most tools), queryname (pairs together) or duplicate"
        value: { type: enum, values: [ coordinate, queryname, duplicate ] }
        rank: 85
      - names: [ --CREATE_INDEX ]
        description: write an index of coordinate-sorted BAM or VCF output
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 45
      - names: [ --VALIDATION_STRINGENCY ]
        description: how strictly SAM records are checked; SILENT or LENIENT tolerate faulty input
        value: { type: enum, values: [ STRICT, LENIENT, SILENT ] }
        default: STRICT
        rank: 45
      - names: [ --REFERENCE_SEQUENCE, -R ]
        description: reference FASTA (needed for CRAM)
        value: { type: file, format: fasta }
        rank: 40
      - names: [ --MAX_RECORDS_IN_RAM ]
        description: records held in memory before spilling to disk; more uses more RAM and fewer files
        value: { type: int }
        default: 500000
        rank: 30
      - names: [ --TMP_DIR ]
        description: folders for temporary files (repeatable)
        value: { type: dir }
        repeatable: true
        rank: 30
      - names: [ --COMPRESSION_LEVEL ]
        description: compression level of BAM and VCF output
        value: { type: int }
        default: 5
        rank: 20
      - names: [ --arguments_file ]
        description: file of arguments added to the command line
        value: { type: file }
        repeatable: true
        rank: 15
      - names: [ --CREATE_MD5_FILE ]
        description: write an MD5 digest of BAM or FASTQ output
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --QUIET ]
        description: no job summary on standard error
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --VERBOSITY ]
        description: log level
        value: { type: enum, values: [ ERROR, WARNING, INFO, DEBUG ] }
        default: INFO
        rank: 15
      - names: [ --USE_JDK_DEFLATER, -use_jdk_deflater ]
        description: JDK compressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --USE_JDK_INFLATER, -use_jdk_inflater ]
        description: JDK decompressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --showHidden ]
        description: also show hidden arguments in the help
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
  - name: MarkDuplicates
    help: [ MarkDuplicates, -h ]
    description: mark (or remove) duplicate reads in coordinate-sorted alignments
    options:
      - names: [ --INPUT, -I ]
        description: coordinate-sorted alignments (repeatable)
        value: { type: file, format: [ bam, sam, cram ], io: input }
        repeatable: true
        rank: 95
      - names: [ --OUTPUT, -O ]
        description: alignments with duplicates flagged
        value: { type: file, format: [ bam, sam, cram ], io: output }
        rank: 90
      - names: [ --METRICS_FILE, -M ]
        description: file for the duplication metrics
        value: { type: file }
        rank: 85
      - names: [ --REMOVE_DUPLICATES ]
        description: leave duplicates out of the output instead of flagging them
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 60
      - names: [ --CREATE_INDEX ]
        description: write an index of coordinate-sorted BAM or VCF output
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 45
      - names: [ --OPTICAL_DUPLICATE_PIXEL_DISTANCE ]
        description: largest distance between optical duplicate clusters (2500 for patterned flow cells)
        value: { type: int }
        default: 100
        rank: 45
      - names: [ --VALIDATION_STRINGENCY ]
        description: how strictly SAM records are checked; SILENT or LENIENT tolerate faulty input
        value: { type: enum, values: [ STRICT, LENIENT, SILENT ] }
        default: STRICT
        rank: 45
      - names: [ --REFERENCE_SEQUENCE, -R ]
        description: reference FASTA (needed for CRAM)
        value: { type: file, format: fasta }
        rank: 40
      - names: [ --REMOVE_SEQUENCING_DUPLICATES ]
        description: leave out optical and other sequencing duplicates only
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 35
      - names: [ --TAGGING_POLICY ]
        description: duplicate types recorded in the DT tag
        value: { type: enum, values: [ DontTag, OpticalOnly, All ] }
        default: DontTag
        rank: 35
      - names: [ --ASSUME_SORT_ORDER, -ASO ]
        description: take the input as having this order, whatever its header says
        value: { type: enum, values: [ unsorted, queryname, coordinate, duplicate, unknown ] }
        rank: 30
      - names: [ --BARCODE_TAG ]
        description: SAM tag of the molecule barcode (e.g. BC for 10X)
        value: { type: string }
        rank: 30
      - names: [ --MAX_RECORDS_IN_RAM ]
        description: records held in memory before spilling to disk; more uses more RAM and fewer files
        value: { type: int }
        default: 500000
        rank: 30
      - names: [ --TMP_DIR ]
        description: folders for temporary files (repeatable)
        value: { type: dir }
        repeatable: true
        rank: 30
      - names: [ --DUPLICATE_SCORING_STRATEGY, -DS ]
        description: how the read kept among duplicates is chosen
        value: { type: enum, values: [ SUM_OF_BASE_QUALITIES, TOTAL_MAPPED_REFERENCE_LENGTH, RANDOM ] }
        default: SUM_OF_BASE_QUALITIES
        rank: 25
      - names: [ --COMPRESSION_LEVEL ]
        description: compression level of BAM and VCF output
        value: { type: int }
        default: 5
        rank: 20
      - names: [ --READ_NAME_REGEX ]
        description: regular expression extracting tile and cluster position from read names (null disables optical detection)
        value: { type: string }
        rank: 20
      - names: [ --arguments_file ]
        description: file of arguments added to the command line
        value: { type: file }
        repeatable: true
        rank: 15
      - names: [ --ASSUME_SORTED, -AS ]
        description: "take the input as coordinate-sorted (deprecated: ASSUME_SORT_ORDER)"
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --CREATE_MD5_FILE ]
        description: write an MD5 digest of BAM or FASTQ output
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --DUPLEX_UMI ]
        description: "UMIs are duplex: two halves joined by a hyphen"
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --FLOW_MODE ]
        description: behaviour for flow-based reads (Ultima)
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --MOLECULAR_IDENTIFIER_TAG ]
        description: SAM tag identifying each molecule (needs BARCODE_TAG)
        value: { type: string }
        rank: 15
      - names: [ --QUIET ]
        description: no job summary on standard error
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --READ_ONE_BARCODE_TAG ]
        description: SAM tag of the read 1 barcode
        value: { type: string }
        rank: 15
      - names: [ --READ_TWO_BARCODE_TAG ]
        description: SAM tag of the read 2 barcode
        value: { type: string }
        rank: 15
      - names: [ --TAG_DUPLICATE_SET_MEMBERS ]
        description: add the duplicate set size (DS) and index (DI) tags
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --VERBOSITY ]
        description: log level
        value: { type: enum, values: [ ERROR, WARNING, INFO, DEBUG ] }
        default: INFO
        rank: 15
      - names: [ --ADD_PG_TAG_TO_READS ]
        description: add the PG tag to each read
        value: { type: enum, values: [ "true", "false" ] }
        default: "true"
        rank: 10
      - names: [ --CLEAR_DT ]
        description: clear existing DT tags
        value: { type: enum, values: [ "true", "false" ] }
        default: "true"
        rank: 10
      - names: [ --COMMENT, -CO ]
        description: comment lines added to the header (repeatable)
        value: { type: string }
        repeatable: true
        rank: 10
      - names: [ --MAX_FILE_HANDLES_FOR_READ_ENDS_MAP, -MAX_FILE_HANDLES ]
        description: most files kept open when spilling to disk (keep under ulimit -n)
        value: { type: int }
        default: 8000
        rank: 10
      - names: [ --MAX_OPTICAL_DUPLICATE_SET_SIZE ]
        description: largest duplicate set checked for optical duplicates
        value: { type: int }
        default: 300000
        rank: 10
      - names: [ --PROGRAM_RECORD_ID, -PG ]
        description: ID of the @PG record added (null adds none)
        value: { type: string }
        default: MarkDuplicates
        rank: 10
      - names: [ --SORTING_COLLECTION_SIZE_RATIO ]
        description: share of the memory given to sorting collections; lower it on memory errors
        value: { type: float }
        default: 0.25
        rank: 10
      - names: [ --USE_JDK_DEFLATER, -use_jdk_deflater ]
        description: JDK compressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --USE_JDK_INFLATER, -use_jdk_inflater ]
        description: JDK decompressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --FLOW_DUP_STRATEGY ]
        description: with FLOW_MODE, how the read kept is chosen
        value: { type: enum, values: [ FLOW_QUALITY_SUM_STRATEGY, FLOW_END_QUALITY_STRATEGY ] }
        default: FLOW_QUALITY_SUM_STRATEGY
        rank: 5
      - names: [ --FLOW_EFFECTIVE_QUALITY_THRESHOLD ]
        description: with FLOW_MODE, quality counted as high
        value: { type: int }
        default: 15
        rank: 5
      - names: [ --FLOW_Q_IS_KNOWN_END ]
        description: with FLOW_MODE, a quality-trimmed end counts as known
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
      - names: [ --FLOW_SKIP_FIRST_N_FLOWS ]
        description: with FLOW_MODE, flows ignored at the read start
        value: { type: int }
        default: 0
        rank: 5
      - names: [ --FLOW_UNPAIRED_END_UNCERTAINTY ]
        description: with FLOW_MODE, end positions this close count as equal
        value: { type: int }
        default: 0
        rank: 5
      - names: [ --FLOW_UNPAIRED_START_UNCERTAINTY ]
        description: with FLOW_MODE, start positions this close count as equal
        value: { type: int }
        default: 0
        rank: 5
      - names: [ --FLOW_USE_END_IN_UNPAIRED_READS ]
        description: with FLOW_MODE, single reads also compare their end
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
      - names: [ --FLOW_USE_UNPAIRED_CLIPPED_END ]
        description: with FLOW_MODE, use the clipped end position
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
      - names: [ --MAX_SEQUENCES_FOR_DISK_READ_ENDS_MAP, -MAX_SEQS ]
        description: obsolete, ignored
        value: { type: int }
        default: 50000
        rank: 5
      - names: [ --PROGRAM_GROUP_COMMAND_LINE, -PG_COMMAND ]
        description: CL of the @PG record
        value: { type: string }
        rank: 5
      - names: [ --PROGRAM_GROUP_NAME, -PG_NAME ]
        description: PN of the @PG record
        value: { type: string }
        default: MarkDuplicates
        rank: 5
      - names: [ --PROGRAM_GROUP_VERSION, -PG_VERSION ]
        description: VN of the @PG record
        value: { type: string }
        rank: 5
      - names: [ --showHidden ]
        description: also show hidden arguments in the help
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
  - name: CollectAlignmentSummaryMetrics
    help: [ CollectAlignmentSummaryMetrics, -h ]
    description: "alignment summary metrics: reads aligned, mismatch rate, read length, chimeras"
    options:
      - names: [ --INPUT, -I ]
        description: alignments
        value: { type: file, format: [ bam, sam, cram ], io: input }
        rank: 95
      - names: [ --OUTPUT, -O ]
        description: metrics file
        value: { type: file, io: output }
        rank: 90
      - names: [ --CREATE_INDEX ]
        description: write an index of coordinate-sorted BAM or VCF output
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 45
      - names: [ --VALIDATION_STRINGENCY ]
        description: how strictly SAM records are checked; SILENT or LENIENT tolerate faulty input
        value: { type: enum, values: [ STRICT, LENIENT, SILENT ] }
        default: STRICT
        rank: 45
      - names: [ --REFERENCE_SEQUENCE, -R ]
        description: reference FASTA (needed for CRAM)
        value: { type: file, format: fasta }
        rank: 40
      - names: [ --HISTOGRAM_FILE, -H ]
        description: PDF of the read length histogram
        value: { type: file }
        rank: 35
      - names: [ --MAX_RECORDS_IN_RAM ]
        description: records held in memory before spilling to disk; more uses more RAM and fewer files
        value: { type: int }
        default: 500000
        rank: 30
      - names: [ --TMP_DIR ]
        description: folders for temporary files (repeatable)
        value: { type: dir }
        repeatable: true
        rank: 30
      - names: [ --IS_BISULFITE_SEQUENCED, -BS ]
        description: bisulfite-sequenced reads
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 25
      - names: [ --METRIC_ACCUMULATION_LEVEL, -LEVEL ]
        description: levels the metrics are computed at (repeatable)
        value: { type: enum, values: [ ALL_READS, SAMPLE, LIBRARY, READ_GROUP ] }
        repeatable: true
        rank: 25
      - names: [ --ASSUME_SORTED, -AS ]
        description: ignore the sort order of the header
        value: { type: enum, values: [ "true", "false" ] }
        default: "true"
        rank: 20
      - names: [ --COMPRESSION_LEVEL ]
        description: compression level of BAM and VCF output
        value: { type: int }
        default: 5
        rank: 20
      - names: [ --EXPECTED_PAIR_ORIENTATIONS ]
        description: orientations of normal pairs; others count as chimeras
        value: { type: enum, values: [ FR, RF, TANDEM ] }
        repeatable: true
        rank: 20
      - names: [ --MAX_INSERT_SIZE ]
        description: pairs above this insert size count as chimeras
        value: { type: int }
        default: 100000
        rank: 20
      - names: [ --ADAPTER_SEQUENCE ]
        description: adapter sequences (repeatable)
        value: { type: string }
        repeatable: true
        rank: 15
      - names: [ --arguments_file ]
        description: file of arguments added to the command line
        value: { type: file }
        repeatable: true
        rank: 15
      - names: [ --CREATE_MD5_FILE ]
        description: write an MD5 digest of BAM or FASTQ output
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --QUIET ]
        description: no job summary on standard error
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 15
      - names: [ --VERBOSITY ]
        description: log level
        value: { type: enum, values: [ ERROR, WARNING, INFO, DEBUG ] }
        default: INFO
        rank: 15
      - names: [ --COLLECT_ALIGNMENT_INFORMATION ]
        description: false counts reads only
        value: { type: enum, values: [ "true", "false" ] }
        default: "true"
        rank: 10
      - names: [ --STOP_AFTER ]
        description: stop after this many reads (for tests)
        value: { type: int }
        default: 0
        rank: 10
      - names: [ --USE_JDK_DEFLATER, -use_jdk_deflater ]
        description: JDK compressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --USE_JDK_INFLATER, -use_jdk_inflater ]
        description: JDK decompressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --showHidden ]
        description: also show hidden arguments in the help
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
  - name: CollectInsertSizeMetrics
    help: [ CollectInsertSizeMetrics, -h ]
    description: insert size distribution of read pairs, with a histogram
    options:
      - names: [ --INPUT, -I ]
        description: alignments
        value: { type: file, format: [ bam, sam, cram ], io: input }
