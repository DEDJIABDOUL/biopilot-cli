        rank: 10
      - names: [ --showHidden ]
        description: also show hidden arguments in the help
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 5
  - name: CollectWgsMetrics
    help: [ CollectWgsMetrics, -h ]
    description: coverage and quality metrics of whole-genome sequencing
    options:
      - names: [ --INPUT, -I ]
        description: alignments
        value: { type: file, format: [ bam, sam, cram ], io: input }
        rank: 95
      - names: [ --OUTPUT, -O ]
        description: metrics file
