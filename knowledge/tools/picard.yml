        rank: 40
      - names: [ --MAX_RECORDS_IN_RAM ]
        description: records held in memory before spilling to disk; more uses more RAM and fewer files
        value: { type: int }
        default: 500000
        rank: 30
      - names: [ --TMP_DIR ]
        description: folders for temporary files (repeatable)
        value: { type: dir }
        repeatable: true
        rank: 30
      - names: [ --INCLUDE_DUPLICATES ]
        description: include reads flagged as duplicates
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 25
      - names: [ --METRIC_ACCUMULATION_LEVEL, -LEVEL ]
        description: levels the metrics are computed at (repeatable)
        value: { type: enum, values: [ ALL_READS, SAMPLE, LIBRARY, READ_GROUP ] }
        repeatable: true
        rank: 25
      - names: [ --MINIMUM_PCT, -M ]
        description: leave out pair orientations below this share of the reads
        value: { type: float }
