        default: 0
        rank: 10
      - names: [ --USE_JDK_DEFLATER, -use_jdk_deflater ]
        description: JDK compressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
        default: "false"
        rank: 10
      - names: [ --USE_JDK_INFLATER, -use_jdk_inflater ]
        description: JDK decompressor instead of Intel's
        value: { type: enum, values: [ "true", "false" ] }
