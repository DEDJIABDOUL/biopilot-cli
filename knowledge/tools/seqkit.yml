# yaml-language-server: $schema=../../schemas/tool.schema.json
# SeqKit 2.14.0, written from its recorded helps: knowledge/help/seqkit/2.14.0/ (MIT;
# attribution in RECORDING.yml next to it) and its documentation
# (https://bioinf.shenwei.me/seqkit), in our own words (spec decision 31). Every subcommand
# repeats the global flags, as each of their helps does. The command list leaves out
# genautocomplete and version. Ranks follow the shared scale of spec §6.4.
name: seqkit
package: seqkit
description: "Fast toolkit for FASTA and FASTQ files: statistics, filtering, search, sampling, splitting, conversion"
version: { args: [ version ], regex: "v(\\d[\\w.]*)" }
help: [ --help ]
options:
  - names: [ -j, --threads ]
    description: CPUs to use (also SEQKIT_THREADS)
    value: { type: int }
    default: 4
    rank: 55
    threads: true
  - names: [ -o, --out-file ]
    description: output file; '-' is standard output, a .gz/.xz/.zst/.bz2 suffix compresses it
    value: { type: file, format: [ fasta, fastq ] }
    default: "-"
    rank: 60
  - names: [ -w, --line-width ]
    description: residues per FASTA line (0 for one line)
    value: { type: int }
    default: 60
    rank: 35
  - names: [ -t, --seq-type ]
    description: sequence type; auto guesses it from the first sequence
    value: { type: enum, values: [ dna, rna, protein, unlimit, auto ] }
    default: auto
    rank: 25
  - names: [ -X, --infile-list ]
    description: file listing input files, one per line, added to those given
    value: { type: file }
    rank: 25
  - names: [ --id-regexp ]
    description: regular expression whose first group is the sequence ID
    value: { type: string }
    default: ^(\S+)\s?
    rank: 15
  - names: [ --id-ncbi ]
    description: headers are NCBI-style (gi|…|ref|…|)
    rank: 10
  - names: [ --quiet ]
    description: print no extra information
    rank: 25
  - names: [ --skip-file-check ]
    description: do not check that the listed input files exist
    rank: 10
  - names: [ --compress-level ]
    description: compression level of compressed output (-1 for the format's default)
    value: { type: int }
    default: -1
    rank: 15
  - names: [ --alphabet-guess-seq-length ]
    description: length of the first sequence's prefix used to guess its type (0 for all of it)
    value: { type: int }
    default: 10000
    rank: 10
commands:
  - name: seq
    help: [ seq, --help ]
    description: "transform sequences: IDs, length and quality filters, gaps, reverse complement, case"
    options:
      - names: [ -m, --min-len ]
        description: keep sequences at least this long (-1 for no limit)
        value: { type: int }
        default: -1
        rank: 80
      - names: [ -M, --max-len ]
        description: keep sequences at most this long (-1 for no limit)
        value: { type: int }
        default: -1
        rank: 60
      - names: [ -Q, --min-qual ]
        description: keep reads whose mean quality is at least this (-1 for no limit)
        value: { type: float }
        default: -1
        rank: 60
      - names: [ -R, --max-qual ]
        description: keep reads whose mean quality is below this (-1 for no limit)
        value: { type: float }
        default: -1
        rank: 25
      - names: [ -r, --reverse ]
        description: reverse the sequences
        rank: 55
      - names: [ -p, --complement ]
        description: complement the sequences (with -r, reverse complement); -v is advised
        rank: 55
      - names: [ -n, --name ]
        description: print headers only
        rank: 55
      - names: [ -i, --only-id ]
        description: print IDs instead of full headers
        rank: 55
      - names: [ -s, --seq ]
        description: print sequences only
        rank: 50
      - names: [ -q, --qual ]
        description: print qualities only
        rank: 25
      - names: [ -g, --remove-gaps ]
        description: remove the gap letters of -G (spaces, tabs, dashes)
        rank: 45
      - names: [ -G, --gap-letters ]
        description: letters that -g removes
        value: { type: string }
        default: "- \t."
        rank: 20
      - names: [ -u, --upper-case ]
        description: write sequences in upper case
        rank: 40
      - names: [ -l, --lower-case ]
        description: write sequences in lower case
        rank: 30
      - names: [ -v, --validate-seq ]
        description: check bases against the alphabet
        rank: 35
      - names: [ --dna2rna ]
        description: turn DNA into RNA
        rank: 30
      - names: [ --rna2dna ]
        description: turn RNA into DNA
        rank: 30
      - names: [ -b, --qual-ascii-base ]
        description: quality offset (33 for Phred+33)
        value: { type: int }
        default: 33
        rank: 20
      - names: [ -k, --color ]
        description: colour the sequences, for less -R
        rank: 15
      - names: [ --f-pattern ]
        description: apply only to records matching these patterns (comma-separated or repeated)
        value: { type: string }
        rank: 30
        repeatable: true
      - names: [ --f-pattern-file ]
        description: apply only to records matching the patterns of this file, one per line
        value: { type: file }
        rank: 25
      - names: [ --f-use-regexp ]
        description: the --f-* patterns are regular expressions
        rank: 20
      - names: [ --f-by-name ]
        description: match the --f-* patterns on full headers, not IDs
        rank: 15
      - names: [ --f-by-seq ]
        description: match the --f-* patterns on sequences, both strands
        rank: 15
      - names: [ --f-only-positive-strand ]
        description: with --f-by-seq, search the positive strand only
        rank: 10
      - names: [ --f-ignore-case ]
        description: the --f-* patterns ignore case
        rank: 10
      - names: [ --f-invert-match ]
        description: apply to the records that do not match instead
        rank: 15
      - names: [ -j, --threads ]
        description: CPUs to use (also SEQKIT_THREADS)
        value: { type: int }
        default: 4
        rank: 55
        threads: true
      - names: [ -o, --out-file ]
        description: output file; '-' is standard output, a .gz/.xz/.zst/.bz2 suffix compresses it
        value: { type: file, format: [ fasta, fastq ] }
        default: "-"
        rank: 60
      - names: [ -w, --line-width ]
        description: residues per FASTA line (0 for one line)
        value: { type: int }
        default: 60
        rank: 35
      - names: [ -t, --seq-type ]
        description: sequence type; auto guesses it from the first sequence
        value: { type: enum, values: [ dna, rna, protein, unlimit, auto ] }
        default: auto
        rank: 25
      - names: [ -X, --infile-list ]
        description: file listing input files, one per line, added to those given
        value: { type: file }
        rank: 25
      - names: [ --id-regexp ]
        description: regular expression whose first group is the sequence ID
        value: { type: string }
        default: ^(\S+)\s?
        rank: 15
      - names: [ --id-ncbi ]
        description: headers are NCBI-style (gi|…|ref|…|)
        rank: 10
      - names: [ --quiet ]
        description: print no extra information
        rank: 25
      - names: [ --skip-file-check ]
        description: do not check that the listed input files exist
        rank: 10
      - names: [ --compress-level ]
        description: compression level of compressed output (-1 for the format's default)
        value: { type: int }
        default: -1
        rank: 15
      - names: [ --alphabet-guess-seq-length ]
        description: length of the first sequence's prefix used to guess its type (0 for all of it)
        value: { type: int }
        default: 10000
        rank: 10
    arguments:
      - name: files
        description: FASTA or FASTQ files, plain or compressed; standard input when none
        variadic: true
        value: { type: file, format: [ fasta, fastq ], optional: true, io: input }
  - name: stats
    help: [ stats, --help ]
    description: "statistics of FASTA/FASTQ files: counts, lengths, N50, Q20/Q30, GC"
    options:
      - names: [ -a, --all ]
        description: "every statistic: length quartiles, gaps, N50, Q20/Q30, mean quality, GC"
        rank: 85
      - names: [ -T, --tabular ]
        description: tab-separated output for scripts
        rank: 75
      - names: [ -b, --basename ]
        description: print file base names only
        rank: 40
      - names: [ -N, --N ]
        description: add N50-like columns for these values (0 to 100), e.g. 50,90
        value: { type: string }
        rank: 35
        repeatable: true
      - names: [ -E, --fq-encoding ]
        description: quality encoding of FASTQ input
        value: { type: enum, values: [ sanger, solexa, illumina-1.3+, illumina-1.5+, illumina-1.8+ ] }
        default: sanger
        rank: 20
      - names: [ -G, --gap-letters ]
        description: letters counted as gaps (add Nn to count N)
