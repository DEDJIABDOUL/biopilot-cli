    repeatable: true
    rank: 55
  - names: ["--fst-window-size"]
    description: "Fst in windows of this size"
    value: { type: int }
    rank: 40
  - names: ["--fst-window-step"]
    description: "step between Fst windows"
    value: { type: int }
    rank: 30
  - names: ["--TajimaD"]
    description: "Tajima's D in windows of this size (.Tajima.D)"
    value: { type: int }
    rank: 45
  - names: ["--indv-freq-burden"]
    description: "number of variants per frequency, per sample"
    rank: 15
  - names: ["--LROH"]
    description: "long runs of homozygosity (with a single --chr)"
    rank: 25
  - names: ["--hist-indel-len"]
    description: "histogram of indel lengths"
    rank: 25
  - names: ["--kept-sites"]
    description: "list the kept sites (.kept.sites)"
    rank: 30
  - names: ["--removed-sites"]
    description: "list the dropped sites (.removed.sites)"
    rank: 30
  - names: ["--hap-r2"]
