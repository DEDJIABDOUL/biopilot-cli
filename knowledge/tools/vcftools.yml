# yaml-language-server: $schema=../../schemas/tool.schema.json
# VCFtools 0.1.16, written from its manual page (vcftools.1 of the bioconda package) and documentation
# (https://vcftools.github.io/man_latest.html), in our own words (spec decision 31); VCFtools is LGPL-3.0.
# Its --help lists no option, so no help command is declared: BioPilot keeps these options and never
# replaces them by an empty Profile. Ranks follow the shared scale of spec §6.4.
name: vcftools
description: filter VCF files by site, sample and genotype, compute population statistics, and convert them
version: { args: ["--version"], regex: 'VCFtools \((\d[\w.]*)\)' }
options:
  - names: ["--vcf"]
    description: "VCF to read (uncompressed)"
    value: { type: file, format: vcf, io: input }
    rank: 95
  - names: ["--gzvcf"]
    description: "gzip-compressed VCF to read"
    value: { type: file, format: vcf, io: input }
    rank: 95
  - names: ["--bcf"]
    description: "BCF to read"
    value: { type: file, format: bcf }
    rank: 80
  - names: ["--out"]
    description: "prefix of the output files"
    value: { type: string }
    rank: 90
  - names: ["--stdout"]
    description: "write to standard output instead of files"
    rank: 60
  - names: ["--temp"]
    description: "folder for temporary files"
    value: { type: dir }
    rank: 20
  - names: ["--recode"]
    description: "write the kept sites and samples as a new VCF"
    rank: 85
  - names: ["--recode-bcf"]
    description: "write the kept sites and samples as a new BCF"
    rank: 55
  - names: ["--recode-INFO-all"]
    description: "keep every INFO field in the recoded file"
    rank: 70
  - names: ["--recode-INFO"]
    description: "keep this INFO field in the recoded file (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 40
  - names: ["--chr"]
    description: "keep only this chromosome (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 70
  - names: ["--not-chr"]
    description: "drop this chromosome (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 45
  - names: ["--from-bp"]
    description: "keep sites from this position (with a single --chr)"
    value: { type: int }
    rank: 45
  - names: ["--to-bp"]
    description: "keep sites up to this position (with a single --chr)"
    value: { type: int }
    rank: 45
  - names: ["--positions"]
    description: "keep the sites listed in this file of chromosome and position"
    value: { type: file }
    rank: 55
  - names: ["--exclude-positions"]
    description: "drop the sites listed in this file of chromosome and position"
    value: { type: file }
    rank: 40
  - names: ["--positions-overlap"]
    description: "keep sites whose reference allele overlaps a listed position"
    value: { type: file }
    rank: 25
  - names: ["--exclude-positions-overlap"]
    description: "drop sites whose reference allele overlaps a listed position"
    value: { type: file }
    rank: 20
  - names: ["--bed"]
    description: "keep the sites inside the regions of this BED file"
    value: { type: file, format: bed }
    rank: 65
  - names: ["--exclude-bed"]
    description: "drop the sites inside the regions of this BED file"
    value: { type: file, format: bed }
    rank: 50
  - names: ["--thin"]
    description: "keep no two sites closer than this many bp"
    value: { type: int }
    rank: 45
  - names: ["--mask"]
    description: "FASTA-like mask: sites whose mask value exceeds --mask-min are dropped"
    value: { type: file }
    rank: 20
  - names: ["--invert-mask"]
    description: "as --mask, with the mask inverted"
    value: { type: file }
    rank: 15
  - names: ["--mask-min"]
    description: "threshold of --mask"
    value: { type: int }
    rank: 15
  - names: ["--snp"]
    description: "keep the site with this ID (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 40
  - names: ["--snps"]
    description: "keep the site IDs listed in this file"
    value: { type: file }
    rank: 45
  - names: ["--exclude"]
    description: "drop the site IDs listed in this file"
    value: { type: file }
    rank: 40
  - names: ["--keep-only-indels"]
    description: "keep only indels"
    rank: 55
  - names: ["--remove-indels"]
    description: "drop indels, keeping SNPs and other variants"
    rank: 65
  - names: ["--remove-filtered-all"]
    description: "drop every site whose FILTER is not PASS"
    rank: 65
  - names: ["--keep-filtered"]
    description: "keep sites with this FILTER flag (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 35
  - names: ["--remove-filtered"]
    description: "drop sites with this FILTER flag (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 35
  - names: ["--keep-INFO"]
    description: "keep sites with this INFO flag (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 25
  - names: ["--remove-INFO"]
    description: "drop sites with this INFO flag (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 25
  - names: ["--maf"]
    description: "keep sites with a minor allele frequency of at least this"
    value: { type: float }
    rank: 75
  - names: ["--max-maf"]
    description: "keep sites with a minor allele frequency of at most this"
    value: { type: float }
    rank: 50
  - names: ["--non-ref-af"]
    description: "keep sites where every non-reference allele has at least this frequency"
    value: { type: float }
    rank: 25
  - names: ["--max-non-ref-af"]
    description: "keep sites where every non-reference allele has at most this frequency"
    value: { type: float }
    rank: 20
  - names: ["--non-ref-ac"]
    description: "keep sites where every non-reference allele has at least this count"
    value: { type: int }
    rank: 20
  - names: ["--max-non-ref-ac"]
    description: "keep sites where every non-reference allele has at most this count"
    value: { type: int }
    rank: 20
  - names: ["--non-ref-af-any"]
    description: "keep sites where some non-reference allele has at least this frequency"
    value: { type: float }
    rank: 20
  - names: ["--max-non-ref-af-any"]
    description: "keep sites where some non-reference allele has at most this frequency"
    value: { type: float }
    rank: 15
  - names: ["--non-ref-ac-any"]
    description: "keep sites where some non-reference allele has at least this count"
    value: { type: int }
    rank: 15
  - names: ["--max-non-ref-ac-any"]
    description: "keep sites where some non-reference allele has at most this count"
    value: { type: int }
    rank: 15
  - names: ["--mac"]
    description: "keep sites with a minor allele count of at least this"
    value: { type: int }
    rank: 55
  - names: ["--max-mac"]
    description: "keep sites with a minor allele count of at most this"
    value: { type: int }
    rank: 35
  - names: ["--min-alleles"]
    description: "keep sites with at least this many alleles (2 with --max-alleles 2: biallelic)"
    value: { type: int }
    rank: 60
  - names: ["--max-alleles"]
    description: "keep sites with at most this many alleles"
    value: { type: int }
    rank: 60
  - names: ["--min-meanDP"]
    description: "keep sites whose mean depth over samples is at least this"
    value: { type: float }
    rank: 55
  - names: ["--max-meanDP"]
    description: "keep sites whose mean depth over samples is at most this"
    value: { type: float }
    rank: 50
  - names: ["--hwe"]
    description: "drop sites whose Hardy-Weinberg exact test p-value is below this"
    value: { type: float }
    rank: 55
  - names: ["--max-missing"]
    description: "keep sites genotyped in at least this fraction of samples (1: no missing data)"
    value: { type: float }
    rank: 70
  - names: ["--max-missing-count"]
    description: "keep sites missing in at most this many samples"
    value: { type: int }
    rank: 40
  - names: ["--phased"]
    description: "keep only phased sites and samples"
    rank: 35
  - names: ["--minQ"]
    description: "keep sites whose QUAL is at least this"
    value: { type: float }
    rank: 70
  - names: ["--indv"]
    description: "keep this sample (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 50
  - names: ["--remove-indv"]
    description: "drop this sample (repeatable)"
    value: { type: string }
    repeatable: true
    rank: 45
  - names: ["--keep"]
    description: "keep the samples listed in this file, one per line (repeatable)"
    value: { type: file }
    repeatable: true
    rank: 65
  - names: ["--remove"]
    description: "drop the samples listed in this file, one per line (repeatable)"
    value: { type: file }
    repeatable: true
    rank: 55
  - names: ["--max-indv"]
    description: "keep at most this many samples, chosen at random"
    value: { type: int }
    rank: 20
  - names: ["--remove-filtered-geno-all"]
    description: "drop genotypes whose FORMAT/FT is not PASS"
    rank: 30
  - names: ["--remove-filtered-geno"]
    description: "drop genotypes with this FT flag"
    value: { type: string }
    rank: 20
  - names: ["--minGQ"]
    description: "drop genotypes of quality below this"
    value: { type: float }
    rank: 55
  - names: ["--minDP"]
    description: "drop genotypes of depth below this"
    value: { type: float }
    rank: 60
  - names: ["--maxDP"]
    description: "drop genotypes of depth above this"
    value: { type: float }
    rank: 45
  - names: ["--freq"]
    description: "allele frequencies per site (.frq)"
    rank: 70
  - names: ["--freq2"]
    description: "allele frequencies per site, without allele names"
    rank: 40
  - names: ["--counts"]
    description: "allele counts per site (.frq.count)"
    rank: 55
  - names: ["--counts2"]
    description: "allele counts per site, without allele names"
    rank: 30
  - names: ["--derived"]
    description: "frequencies of the derived allele, given AA in INFO (with --freq or --counts)"
